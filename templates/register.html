{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h2>Student Registration</h2>
<form method="post">
  <label>Full name <input type="text" name="name" required></label>
  <label>Email (@uni.edu) <input type="email" name="email" required></label>
  <label>Password (min. 12 characters) <input type="password" name="password" minlength="12" required></label>
  <button type="submit">Register</button>
</form>
<p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
