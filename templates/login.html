{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Login</h2>
<form method="post">
  <label>Email <input type="email" name="email" required></label>
  <label>Password <input type="password" name="password" required></label>
  <button type="submit">Log in</button>
</form>
<p>Lecturers: sign in with the account credentials provided by your administrator.</p>
<p>New student? <a href="{{ url_for('register') }}">Register here</a></p>
{% endblock %}
